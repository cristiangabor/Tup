version: "3.9"

services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    init: true
    user: vscode
    working_dir: /workspaces/Tup
    volumes:
      - .:/workspaces/Tup:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/tup
      PORT: "3000"
