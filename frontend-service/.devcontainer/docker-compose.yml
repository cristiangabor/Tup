version: '3.8'
services:
  # Update this to the name of the service you want to work with in your docker-compose.yml file
  frontend-service:
    # The production Dockerfile's final stage uses a distroless (shell-less) base image,
    # which is incompatible with Dev Container Features (they run shell commands during
    # the build) and with normal dev-container use (no shell to attach to, no cargo/rustc).
    # Build against the "builder" stage instead, which is based on rust:1.93-slim-bookworm
    # and has a shell plus the full Rust toolchain.
    build:
      target: builder

    volumes:
      # Update this to wherever you want VS Code to mount the folder of your project
      - ..:/workspaces:cached

    # Required for ptrace-based debuggers (lldb / gdb) to attach to processes.
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity
 
